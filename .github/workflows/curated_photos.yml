name: Apply verified itinerary photos
on:
  push:
    branches: [main]
    paths:
      - curated_photos.py
      - .github/workflows/curated_photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4 pillow
      - name: Download verified photo files and update HTML
        run: python curated_photos.py
      - name: Commit verified images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/
          git diff --cached --quiet || (git commit -m "Apply curated Wikimedia Commons photos" && git push)


name: Download itinerary photos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pillow
      - name: Find and download photos
        run: python fetch_photos.py
      - name: Save images and updated HTML to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/ PHOTO_REVIEW.csv
          git diff --cached --quiet || (git commit -m "Add local itinerary images" && git push)
